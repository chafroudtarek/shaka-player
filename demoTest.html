<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shaka Player Layout Manager Demo</title>
  <link rel="shortcut icon" href="#">
  <link rel="stylesheet" type="text/css" href="dist/controls.css">
  <script src="dist/shaka-player.compiled.js"></script>
  <script src="dist/shaka-player.compiled.debug.js"></script>
  <script src="dist/shaka-player.ui.js"></script>
  <style>
    .video-container {
      max-width: 800px;
      margin: 20px auto;
    }
    .config-panel {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .config-panel button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .theme-default { background: #2196F3; color: white; }
    .theme-dark { background: #333; color: white; }
    .theme-gradient { background: linear-gradient(45deg, #FF5722, #FF9800); color: white; }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="video" width="100%" poster="//shaka-player-demo.appspot.com/assets/poster.jpg"></video>
  </div>

  <div class="config-panel">
    <h3>Layout Themes</h3>
    <button class="theme-default" onclick="applyDefaultTheme()">Default Theme</button>
    <button class="theme-test" onclick="applyTestTheme()">Test Theme</button>
  </div>

  <script>
    let player = null;
    let ui = null;
    let layoutManager = null;

    async function initApp() {
      shaka.polyfill.installAll();
      
      const video = document.getElementById('video');
      const videoContainer = video.parentElement;
      
      player = new shaka.Player(video);
      ui = new shaka.ui.Overlay(player, videoContainer, video);
      layoutManager = new shaka.ui.LayoutManager(videoContainer, ui.getControls());

      // Listen to errors
      player.addEventListener('error', onError);
      
      try {
        await player.load('//storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd');
        console.log('The video has now been loaded!');
      } catch (error) {
        onError(error);
      }
    }

    function onError(error) {
      console.error('Error code', error.code, 'object', error);
    }

    function applyDefaultTheme() {
      layoutManager.applyConfig({
        controls: {
          background: 'rgba(0, 0, 0, 0.8)',
          height: '48px',
          width: '100%',
          opacity: 1,
          borderRadius: '40px',
          padding: '0 16px'
        },
        progressBar: {
          base: 'green',                        // Dark background
          buffered: 'red',                    // Slightly lighter grayd
          played: 'linear-gradient(90deg, #ff0000, #ff6b6b)', // Red gradient
          hover: 'green'                        // Bright red on hover
        }
      });
    }

    function applyTestTheme() {
      layoutManager.applyConfig({
        controls: {
          background: 'red',
          height: '48px',
          width: '100%',
          opacity: 10,
          borderRadius: '40px',
          padding: '0 16px',
          position: 'bottom'
        },
        progressBar: {
          base: '#333333',          // Dark gray background
          buffered: '#666666',      // Medium gray for buffered
          played: '#ff0000',        // Red for played portion
          hover: '#ff3333'          // Lighter red for hover
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
